<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="#0a0a0a" letter-spacing="1.5">
    <text x="40" y="36" font-weight="600">FIG · UNILATERAL GREEN INDUSTRIAL POLICIES</text>
    <text x="40" y="52" fill="rgba(10,10,10,0.5)">A "RACE TO THE TOP" — DRIVEN BY MAJOR ECONOMIES</text>
  </g>

  <g transform="translate(60,100)">
    <g>
      <rect x="0" y="0" width="220" height="240" fill="#0a0a0a"/>
      <g font-family="ui-monospace" font-size="10" fill="rgba(250,249,246,0.6)">
        <text x="20" y="30">US</text>
        <text x="200" y="30" text-anchor="end">2022</text>
      </g>
      <text x="20" y="80" font-family="Inter" font-size="22" font-weight="600" fill="#faf9f6">IRA</text>
      <text x="20" y="106" font-family="Inter" font-size="13" fill="rgba(250,249,246,0.7)">Inflation Reduction Act</text>
      <g font-family="ui-monospace" font-size="10" fill="rgba(250,249,246,0.6)">
        <text x="20" y="140">$369 B</text>
        <text x="20" y="156" fill="rgba(250,249,246,0.45)">CLIMATE &amp; CLEAN ENERGY</text>
        <text x="20" y="190">EV TAX CREDITS</text>
        <text x="20" y="206">RENEWABLE BUILD-OUT</text>
        <text x="20" y="222">HOME RETROFITS</text>
      </g>
    </g>

    <g transform="translate(240,0)">
      <rect x="0" y="0" width="220" height="240" fill="none" stroke="#0a0a0a" stroke-width="1"/>
      <g font-family="ui-monospace" font-size="10" fill="#0a0a0a">
        <text x="20" y="30">EU</text>
        <text x="200" y="30" text-anchor="end">2019-</text>
      </g>
      <text x="20" y="80" font-family="Inter" font-size="22" font-weight="600" fill="#0a0a0a">GREEN DEAL</text>
      <text x="20" y="106" font-family="Inter" font-size="13" fill="rgba(10,10,10,0.7)">Fit for 55 · CBAM</text>
      <g font-family="ui-monospace" font-size="10" fill="rgba(10,10,10,0.6)">
        <text x="20" y="140">−55%</text>
        <text x="20" y="156" fill="rgba(10,10,10,0.45)">GHG BY 2030</text>
        <text x="20" y="190">CARBON BORDER TAX</text>
        <text x="20" y="206">STAKEHOLDER CAP.</text>
        <text x="20" y="222">RENEWABLE MANDATES</text>
      </g>
    </g>

    <g transform="translate(480,0)">
      <rect x="0" y="0" width="220" height="240" fill="#ff5b1f"/>
      <g font-family="ui-monospace" font-size="10" fill="rgba(250,249,246,0.6)">
        <text x="20" y="30">IN</text>
        <text x="200" y="30" text-anchor="end">PANCHAMRIT</text>
      </g>
      <text x="20" y="80" font-family="Inter" font-size="22" font-weight="600" fill="#faf9f6">500 GW</text>
      <text x="20" y="106" font-family="Inter" font-size="13" fill="rgba(250,249,246,0.85)">Non-fossil by 2030</text>
      <g font-family="ui-monospace" font-size="10" fill="rgba(250,249,246,0.85)">
        <text x="20" y="140">NET ZERO BY 2070</text>
        <text x="20" y="156" fill="rgba(250,249,246,0.55)">PLEDGED</text>
        <text x="20" y="190">50% RENEWABLES</text>
        <text x="20" y="206">NATIONAL H2 MISSION</text>
        <text x="20" y="222">GREEN HYDROGEN</text>
      </g>
    </g>
  </g>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="rgba(10,10,10,0.55)">
    <text x="40" y="430">CBAM RISKS TRADE FRICTION; IRA DOMESTIC-CONTENT RULES DRAW EU COMPLAINT.</text>
    <text x="40" y="446">WTO GATT ART. XX PERMITS ENVIRONMENTAL EXCEPTIONS — TESTED IN US-SHRIMP (1998).</text>
  </g>
</svg>
