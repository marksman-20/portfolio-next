<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="#0a0a0a" letter-spacing="1.5">
    <text x="40" y="36" font-weight="600">FIG · ESTIMATED CO₂e EMISSIONS (MILLION TONS)</text>
    <text x="40" y="52" fill="rgba(10,10,10,0.5)">SCOPE 1 + 2 · SOURCES: TATA CCR, CLIMATE TRACE 2022</text>
  </g>

  <g transform="translate(120,110)">
    <text x="0" y="0" font-family="ui-monospace" font-size="10" fill="rgba(10,10,10,0.5)">RELATIVE TO PRODUCTION</text>
    <line x1="0" y1="10" x2="540" y2="10" stroke="#0a0a0a" stroke-width="1"/>

    <g transform="translate(0,40)">
      <text x="0" y="20" font-family="ui-monospace" font-size="10" fill="#0a0a0a">TATA · JAMSHEDPUR</text>
      <text x="0" y="36" font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.5)">24.3 Mt CO₂ · biochar mitigates ~50 kt/yr</text>
      <rect x="0" y="46" width="310" height="14" fill="#0a0a0a"/>
      <text x="320" y="58" font-family="ui-monospace" font-size="11" fill="#0a0a0a">24.3</text>
    </g>

    <g transform="translate(0,120)">
      <text x="0" y="20" font-family="ui-monospace" font-size="10" fill="#0a0a0a">RELIANCE · JAMNAGAR</text>
      <text x="0" y="36" font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.5)">32.38 Mt CO₂e · four giga-factories planned</text>
      <rect x="0" y="46" width="413" height="14" fill="#ff5b1f"/>
      <text x="423" y="58" font-family="ui-monospace" font-size="11" fill="#ff5b1f">32.38</text>
    </g>

    <g transform="translate(0,220)">
      <text x="0" y="0" font-family="ui-monospace" font-size="10" fill="rgba(10,10,10,0.5)">DELTA</text>
      <text x="0" y="22" font-family="Inter" font-size="32" font-weight="500" fill="#0a0a0a">+8.08 Mt</text>
      <text x="0" y="40" font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.5)">33% MORE EMISSIONS AT RELIANCE JAMNAGAR COMPLEX</text>
    </g>
  </g>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="rgba(10,10,10,0.55)">
    <text x="40" y="430">SCALE NOTE: REFINING EMITS LESS PER UNIT THAN BLAST-FURNACE STEEL.</text>
    <text x="40" y="446">DIRECT MT-TO-MT COMPARISON REQUIRES PRODUCTION-NORMALISATION.</text>
  </g>
</svg>
