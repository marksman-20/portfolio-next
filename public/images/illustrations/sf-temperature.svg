<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1f4d8a"/>
      <stop offset="0.3" stop-color="#2c8f6b"/>
      <stop offset="0.6" stop-color="#f4c430"/>
      <stop offset="0.85" stop-color="#ff5b1f"/>
      <stop offset="1" stop-color="#bf1d0a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="#0a0a0a" letter-spacing="1.5">
    <text x="40" y="36" font-weight="600">FIG 2 · MODIS LAND SURFACE TEMPERATURE</text>
    <text x="40" y="52" fill="rgba(10,10,10,0.5)">JAMSHEDPUR INDUSTRIAL ZONE · URBAN HEAT ISLAND EFFECT</text>
  </g>

  <g transform="translate(60,90)">
    <rect width="680" height="280" fill="none" stroke="rgba(10,10,10,0.2)" stroke-width="1"/>

    <g opacity="0.85">
      <ellipse cx="240" cy="140" rx="80" ry="50" fill="url(#heat)"/>
      <ellipse cx="380" cy="170" rx="110" ry="70" fill="url(#heat)"/>
      <ellipse cx="540" cy="130" rx="70" ry="45" fill="url(#heat)"/>
      <ellipse cx="450" cy="220" rx="120" ry="35" fill="url(#heat)" opacity="0.7"/>
    </g>

    <g font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.7)">
      <circle cx="200" cy="120" r="3" fill="#0a0a0a"/>
      <text x="200" y="112" text-anchor="middle">34°C</text>
      <circle cx="380" cy="170" r="3" fill="#0a0a0a"/>
      <text x="380" y="162" text-anchor="middle">41°C</text>
      <circle cx="540" cy="130" r="3" fill="#0a0a0a"/>
      <text x="540" y="122" text-anchor="middle">37°C</text>
      <circle cx="450" cy="220" r="3" fill="#0a0a0a"/>
      <text x="450" y="234" text-anchor="middle">38°C</text>
    </g>

    <g transform="translate(0,310)">
      <rect width="680" height="6" fill="url(#heat)"/>
      <g font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.55)">
        <text x="0" y="22">22°C</text>
        <text x="170" y="22">28°C</text>
        <text x="340" y="22">34°C</text>
        <text x="510" y="22">40°C</text>
        <text x="640" y="22" text-anchor="end">45°C</text>
      </g>
    </g>
  </g>
</svg>
