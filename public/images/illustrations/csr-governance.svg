        </g>
      </g>

      <g>
        <circle cx="0" cy="-100" r="44" fill="#0a0a0a"/>
        <text x="0" y="-94" text-anchor="middle" font-family="Inter" font-size="11" font-weight="600" fill="#faf9f6">TATA</text>
        <text x="0" y="-80" text-anchor="middle" font-family="ui-monospace" font-size="8" fill="#faf9f6">DIVERSE</text>
