<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(10,10,10,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>
  <rect width="800" height="460" fill="url(#grid)"/>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="#0a0a0a" letter-spacing="1.5">
    <text x="40" y="36" font-weight="600">FIG · CSR SPEND (₹ CRORE)</text>
    <text x="40" y="52" fill="rgba(10,10,10,0.5)">FY 2022-23 / FY 2023-24 · SOURCES: ANNUAL REPORTS</text>
  </g>

  <g transform="translate(80,100)">
    <line x1="0" y1="260" x2="640" y2="260" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="260" stroke="#0a0a0a" stroke-width="1"/>

    <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" fill="rgba(10,10,10,0.55)">
      <text x="-32" y="4" text-anchor="end">2000</text>
      <text x="-32" y="84" text-anchor="end">1500</text>
      <text x="-32" y="164" text-anchor="end">1000</text>
      <text x="-32" y="244" text-anchor="end">500</text>
    </g>

    <g stroke="rgba(10,10,10,0.08)" stroke-dasharray="3,3">
      <line x1="0" y1="0" x2="640" y2="0"/>
      <line x1="0" y1="80" x2="640" y2="80"/>
      <line x1="0" y1="160" x2="640" y2="160"/>
    </g>

    <g transform="translate(120,0)">
      <rect x="0" y="198.8" width="120" height="61.2" fill="#0a0a0a"/>
      <text x="60" y="186" text-anchor="middle" font-family="Inter" font-size="22" font-weight="600" fill="#0a0a0a">₹481</text>
      <text x="60" y="290" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="#0a0a0a">TATA STEEL</text>
      <text x="60" y="305" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" fill="rgba(10,10,10,0.5)">FY 2022-23</text>
    </g>

    <g transform="translate(380,0)">
      <rect x="0" y="56.8" width="120" height="203.2" fill="#ff5b1f"/>
      <text x="60" y="44" text-anchor="middle" font-family="Inter" font-size="22" font-weight="600" fill="#ff5b1f">₹1,592</text>
      <text x="60" y="290" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="11" fill="#0a0a0a">RELIANCE JAMNAGAR</text>
      <text x="60" y="305" text-anchor="middle" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" fill="rgba(10,10,10,0.5)">FY 2023-24</text>
    </g>
  </g>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="rgba(10,10,10,0.55)">
    <text x="40" y="430">NOTE: RELIANCE OUTSPENDS TATA ~3.3× ON CSR.</text>
    <text x="40" y="446">TATA STEEL UP 18.49% YOY FROM ₹406 CR → ₹481 CR.</text>
  </g>
</svg>
