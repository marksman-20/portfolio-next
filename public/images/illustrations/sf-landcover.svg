<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="#0a0a0a" letter-spacing="1.5">
    <text x="40" y="36" font-weight="600">FIG 3 · DYNAMIC WORLD LAND COVER</text>
    <text x="40" y="52" fill="rgba(10,10,10,0.5)">JAMSHEDPUR URBAN · 2015 vs 2023</text>
  </g>

  <g transform="translate(60,100)">
    <g>
      <text x="0" y="0" font-family="ui-monospace" font-size="10" fill="#0a0a0a">2015</text>
      <rect x="0" y="10" width="320" height="240" fill="none" stroke="rgba(10,10,10,0.2)"/>
      <rect x="20" y="40" width="120" height="80" fill="#1f9d55" opacity="0.6"/>
      <rect x="160" y="30" width="140" height="100" fill="#1f9d55" opacity="0.5"/>
      <rect x="60" y="150" width="100" height="60" fill="#c2a050" opacity="0.7"/>
      <rect x="180" y="150" width="80" height="60" fill="#c2a050" opacity="0.6"/>
      <rect x="80" y="80" width="50" height="40" fill="#bf3e22" opacity="0.85"/>
      <rect x="200" y="100" width="40" height="30" fill="#bf3e22" opacity="0.85"/>
      <rect x="280" y="180" width="30" height="20" fill="#bf3e22" opacity="0.85"/>
    </g>
    <g transform="translate(360,0)">
      <text x="0" y="0" font-family="ui-monospace" font-size="10" fill="#0a0a0a">2023</text>
      <rect x="0" y="10" width="320" height="240" fill="none" stroke="rgba(10,10,10,0.2)"/>
      <rect x="10" y="30" width="80" height="50" fill="#1f9d55" opacity="0.4"/>
      <rect x="120" y="20" width="50" height="40" fill="#1f9d55" opacity="0.4"/>
      <rect x="40" y="140" width="60" height="40" fill="#c2a050" opacity="0.5"/>
      <rect x="150" y="140" width="40" height="30" fill="#c2a050" opacity="0.5"/>
      <rect x="40" y="60" width="200" height="160" fill="#bf3e22" opacity="0.9"/>
      <rect x="100" y="100" width="60" height="40" fill="#0a0a0a" opacity="0.7"/>
      <rect x="200" y="150" width="40" height="30" fill="#0a0a0a" opacity="0.7"/>
      <rect x="260" y="190" width="30" height="20" fill="#0a0a0a" opacity="0.7"/>
    </g>
  </g>

  <g transform="translate(60,400)" font-family="ui-monospace" font-size="9" fill="#0a0a0a">
    <g><rect x="0" y="0" width="14" height="14" fill="#1f9d55" opacity="0.6"/><text x="20" y="11">VEGETATION</text></g>
    <g transform="translate(120,0)"><rect x="0" y="0" width="14" height="14" fill="#c2a050" opacity="0.7"/><text x="20" y="11">CROPLAND</text></g>
    <g transform="translate(230,0)"><rect x="0" y="0" width="14" height="14" fill="#bf3e22" opacity="0.9"/><text x="20" y="11">BUILT-UP</text></g>
    <g transform="translate(340,0)"><rect x="0" y="0" width="14" height="14" fill="#0a0a0a" opacity="0.7"/><text x="20" y="11">INDUSTRIAL</text></g>
  </g>
</svg>
