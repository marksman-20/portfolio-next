<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="orb" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.4" stop-color="#1a1a2e"/>
      <stop offset="0.7" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0f1a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3a7bd5" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#1f4d8a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="gr" width="3" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.4" fill="rgba(255,255,255,0.04)"/>
