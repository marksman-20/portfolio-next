    <circle cx="800" cy="200" r="1.6" opacity="0.7"/>
    <circle cx="380" cy="280" r="1.4" opacity="0.5"/>
    <circle cx="850" cy="380" r="1.8" opacity="0.6"/>
    <circle cx="320" cy="380" r="1.4" opacity="0.4"/>
    <circle cx="920" cy="260" r="1.6" opacity="0.5"/>
    <circle cx="600" cy="140" r="1.4" opacity="0.5"/>
    <circle cx="600" cy="460" r="1.4" opacity="0.5"/>
