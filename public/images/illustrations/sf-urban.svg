      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
    <radialGradient id="ring1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2c5cff" stop-opacity="0.0"/>
      <stop offset="0.6" stop-color="#2c5cff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2c5cff" stop-opacity="0.0"/>
