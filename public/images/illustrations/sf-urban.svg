      <path d="M 60 0 L 100 30 L 130 50 L 110 90 L 80 80 L 60 50 Z" fill="#2c5cff" fill-opacity="0.45"/>
      <path d="M 0 60 L -20 100 L 0 130 L 40 120 L 50 90 L 30 60 Z" fill="#2c5cff" fill-opacity="0.4"/>
