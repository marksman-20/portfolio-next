<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="#0a0a0a" letter-spacing="1.5">
    <text x="40" y="36" font-weight="600">FIG · MODIS DAYTIME LST · TATA PLANT BUFFER</text>
    <text x="40" y="52" fill="rgba(10,10,10,0.5)">SINUSOIDAL FIT — STALLMAN (1965) FORM</text>
  </g>

  <g transform="translate(80,90)">
    <line x1="0" y1="0" x2="0" y2="280" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="0" y1="280" x2="640" y2="280" stroke="#0a0a0a" stroke-width="1"/>

    <g stroke="rgba(10,10,10,0.06)" stroke-dasharray="2 3">
      <line x1="0" y1="40" x2="640" y2="40"/>
      <line x1="0" y1="120" x2="640" y2="120"/>
      <line x1="0" y1="200" x2="640" y2="200"/>
    </g>

    <g font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.55)">
      <text x="-6" y="4" text-anchor="end">44°</text>
      <text x="-6" y="84" text-anchor="end">36°</text>
      <text x="-6" y="164" text-anchor="end">28°</text>
      <text x="-6" y="244" text-anchor="end">20°</text>
      <text x="-6" y="284" text-anchor="end">°C</text>
      <text x="0" y="298" text-anchor="middle">2015</text>
      <text x="160" y="298" text-anchor="middle">2017</text>
      <text x="320" y="298" text-anchor="middle">2019</text>
      <text x="480" y="298" text-anchor="middle">2021</text>
      <text x="640" y="298" text-anchor="middle">2023</text>
    </g>

    <g fill="rgba(10,10,10,0.5)">
      <circle cx="20" cy="120" r="2.2"/>
      <circle cx="60" cy="100" r="2.2"/>
      <circle cx="100" cy="60" r="2.2"/>
      <circle cx="140" cy="40" r="2.2"/>
      <circle cx="180" cy="80" r="2.2"/>
      <circle cx="220" cy="120" r="2.2"/>
      <circle cx="260" cy="180" r="2.2"/>
      <circle cx="300" cy="160" r="2.2"/>
      <circle cx="340" cy="100" r="2.2"/>
      <circle cx="380" cy="60" r="2.2"/>
      <circle cx="420" cy="50" r="2.2"/>
      <circle cx="460" cy="90" r="2.2"/>
      <circle cx="500" cy="130" r="2.2"/>
      <circle cx="540" cy="170" r="2.2"/>
      <circle cx="580" cy="140" r="2.2"/>
      <circle cx="620" cy="80" r="2.2"/>
    </g>

    <path d="M 0 110 C 40 30, 80 30, 120 110 S 200 200, 240 110 S 320 30, 360 110 S 440 200, 480 110 S 560 30, 600 110 S 680 200, 720 110"
          fill="none" stroke="#ff5b1f" stroke-width="2" transform="translate(0,0) scale(0.85,1)"/>

    <g font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.65)">
      <text x="640" y="20" text-anchor="end" fill="#ff5b1f">FIT · LST(t) = LST₀ + ΔLST·cos(2πt/τ − φ)</text>
      <text x="640" y="36" text-anchor="end">τ ≈ 365 d · ΔLST ≈ 8.4° · LST₀ ≈ 31.6°</text>
    </g>
  </g>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="rgba(10,10,10,0.55)">
    <text x="40" y="430">MEAN TEMPERATURE TREND ROSE ~1.4°C OVER 8 YEARS (p &lt; 0.05).</text>
    <text x="40" y="446">NDVI MANN-KENDALL: SIGNIFICANT GREEN-LOSS TREND, 2017-2020.</text>
  </g>
</svg>
