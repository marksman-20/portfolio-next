<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#faf9f6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="460" fill="url(#bg)"/>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="#0a0a0a" letter-spacing="1.5">
    <text x="40" y="36" font-weight="600">FIG · SOCIAL IMPACT FOOTPRINT</text>
    <text x="40" y="52" fill="rgba(10,10,10,0.5)">LIVES TOUCHED · ACRES OF INTERVENTION</text>
  </g>

  <g transform="translate(80,110)">
    <g>
      <circle cx="160" cy="140" r="110" fill="none" stroke="#0a0a0a" stroke-width="1"/>
      <circle cx="160" cy="140" r="70" fill="none" stroke="#0a0a0a" stroke-width="1"/>
      <circle cx="160" cy="140" r="40" fill="#0a0a0a"/>
      <text x="160" y="146" text-anchor="middle" font-family="Inter" font-size="22" font-weight="600" fill="#faf9f6">1.4M</text>
      <text x="160" y="285" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="#0a0a0a">TATA · JAMSHEDPUR</text>
      <text x="160" y="300" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.5)">EDUCATION · HEALTH · TRIBAL CULTURE</text>
    </g>

    <g transform="translate(380,0)">
      <rect x="0" y="0" width="280" height="280" fill="none" stroke="#ff5b1f" stroke-width="1"/>
      <rect x="40" y="40" width="200" height="200" fill="none" stroke="#ff5b1f" stroke-width="1"/>
      <rect x="100" y="100" width="80" height="80" fill="#ff5b1f"/>
      <text x="140" y="148" text-anchor="middle" font-family="Inter" font-size="20" font-weight="600" fill="#faf9f6">3,000</text>
      <text x="140" y="170" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="#faf9f6">ACRES</text>
      <text x="140" y="310" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="#0a0a0a">RELIANCE · JAMNAGAR</text>
      <text x="140" y="325" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="rgba(10,10,10,0.5)">VANTARA · SCHOOLS · HEALTH</text>
    </g>
  </g>

  <g font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="10" fill="rgba(10,10,10,0.55)">
    <text x="40" y="430">TATA METRICS ARE POPULATION-DENSE; RELIANCE'S ARE AREA-DENSE.</text>
    <text x="40" y="446">BOTH REACH MILLIONS — VIA DIFFERENT MECHANISMS.</text>
  </g>
</svg>
